name: Performance gates

# GitHub-hosted runners have no CUDA or MPS device, so the device-conditional
# perf_gate tests skip here and only the cpu roofline case runs. Meaningful
# device coverage requires dispatching this workflow on a self-hosted GPU
# runner, or running the same pytest commands on a CUDA or MPS host and
# reporting the results on the pull request.
on:
  workflow_dispatch:

jobs:
  perf:
    name: Manual performance gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: bash scripts/setup_environment.sh

      - name: Run device performance gates
        shell: bash
        run: |
          source scripts/activate_environment.sh
          python -m pytest -m perf_gate

      - name: Run roofline gates
        shell: bash
        env:
          LEIBNIZ_PERF_GATES: "1"
        run: |
          source scripts/activate_environment.sh
          python -m pytest -m perf_roofline
