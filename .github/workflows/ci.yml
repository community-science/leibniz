name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run tests
        run: python -m pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run lint
        run: python -m ruff check .

  type:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run type check
        run: python -m pyright

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run repository policy checks
        run: python -m leibniz.repository_policy .

  package:
    name: Build and import package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Import installed package
        run: python -c "import leibniz; print(leibniz.__version__)"
