name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml', 'pyproject.toml') }}

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Run tests
        run: python scripts/validate.py --check tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml', 'pyproject.toml') }}

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Run lint
        run: python scripts/validate.py --check lint

  type:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml', 'pyproject.toml') }}

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Run type check
        run: python scripts/validate.py --check type

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml', 'pyproject.toml') }}

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Run repository policy checks
        run: python scripts/validate.py --check repository-policy

  console:
    name: Console build and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml', 'pyproject.toml') }}

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/leibniz/console/web/package-lock.json

      - name: Install console dependencies
        run: npm ci
        working-directory: src/leibniz/console/web

      - name: Install headless browser
        run: npx playwright install --with-deps chromium
        working-directory: src/leibniz/console/web

      - name: Run console workflow tests
        run: python scripts/validate.py --check console

  package:
    name: Build and import package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml', 'pyproject.toml') }}

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: leibniz-dev
          environment-file: environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Build wheel and source distribution
        run: python scripts/validate.py --check package
